name: Integración continua

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      guardar_imagen:
        description: Guardar el artefacto verificado para publicar una versión
        required: false
        default: false
        type: boolean
      ref:
        description: Commit exacto que debe verificar el workflow reutilizable
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  maven-verify:
    name: Maven y pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Comprobar Docker para Testcontainers
        run: docker info

      - name: Compilar y ejecutar pruebas
        run: ./mvnw --batch-mode clean verify

      - name: Verificar ejecución de pruebas de integración
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          sources = Path('src/test/java')
          reports = Path('target/surefire-reports')
          integration_tests = list(sources.rglob('*IntegracionTest.java'))
          integration_tests += list(sources.rglob('RetiroComponenteConcurrenciaTest.java'))
          integration_tests += list(sources.rglob('UsuarioConcurrenciaTest.java'))
          if not integration_tests:
              sys.exit('No se encontraron pruebas de integración.')

          failures = []
          for source in sorted(integration_tests):
              matches = list(reports.glob(f'TEST-*.{source.stem}.xml'))
              if len(matches) != 1:
                  failures.append(f'{source.stem}: informe ausente o duplicado')
                  continue
              report = ET.parse(matches[0]).getroot()
              tests = int(report.get('tests', '0'))
              skipped = int(report.get('skipped', '0'))
              errors = int(report.get('errors', '0'))
              failed = int(report.get('failures', '0'))
              print(f'{source.stem}: {tests} pruebas, {skipped} omitidas, {errors} errores, {failed} fallos')
              if tests == 0 or skipped or errors or failed:
                  failures.append(f'{source.stem}: ejecución incompleta o fallida')
          if failures:
              sys.exit('\n'.join(failures))
          PY

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 1

      - name: Transferir el JAR verificado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trazalab-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/trazalab-*.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  imagen-docker:
    name: Construir imagen Docker
    needs: maven-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Descargar el JAR verificado
        uses: actions/download-artifact@v4
        with:
          name: trazalab-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: target

      - name: Construir y guardar imagen Docker
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag trazalab:ci .
          mkdir -p artefacto-imagen
          docker image inspect --format '{{.Id}}' trazalab:ci > artefacto-imagen/imagen.id
          docker image save --output artefacto-imagen/trazalab.tar trazalab:ci
          cd artefacto-imagen
          sha256sum trazalab.tar > trazalab.tar.sha256

      - name: Guardar imagen para smoke test
        uses: actions/upload-artifact@v4
        with:
          name: trazalab-imagen-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artefacto-imagen/trazalab.tar
            artefacto-imagen/trazalab.tar.sha256
            artefacto-imagen/imagen.id
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  smoke-postgres:
    name: Smoke test con PostgreSQL 16
    needs: imagen-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar imagen construida
        uses: actions/download-artifact@v4
        with:
          name: trazalab-imagen-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artefacto-imagen

      - name: Verificar identidad y checksum de la imagen
        shell: bash
        run: |
          set -euo pipefail
          cd artefacto-imagen
          sha256sum --check trazalab.tar.sha256
          docker image load --input trazalab.tar
          esperado=$(tr -d '\r\n' < imagen.id)
          actual=$(docker image inspect --format '{{.Id}}' trazalab:ci)
          [[ "$esperado" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$actual" = "$esperado"

      - name: Ejecutar PostgreSQL y comprobar salud de la aplicación
        shell: bash
        run: |
          set -euo pipefail
          red="trazalab-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="${red}-db"
          aplicacion="${red}-app"
          limpiar() {
            docker logs "$aplicacion" 2>/dev/null || true
            docker rm -f "$aplicacion" "$base" >/dev/null 2>&1 || true
            docker network rm "$red" >/dev/null 2>&1 || true
          }
          trap limpiar EXIT
          docker network create "$red" >/dev/null
          docker run -d --name "$base" --network "$red" \
            -e POSTGRES_DB=trazalab -e POSTGRES_USER=trazalab \
            -e POSTGRES_PASSWORD=prueba-ci postgres:16 >/dev/null
          for intento in {1..60}; do
            if docker exec "$base" pg_isready -U trazalab -d trazalab; then
              break
            fi
            if [ "$intento" -eq 60 ]; then
              exit 1
            fi
            sleep 2
          done
          docker run -d --name "$aplicacion" --network "$red" \
            -p 127.0.0.1:18080:8080 \
            -e "SPRING_DATASOURCE_URL=jdbc:postgresql://${base}:5432/trazalab" \
            -e SPRING_DATASOURCE_USERNAME=trazalab \
            -e SPRING_DATASOURCE_PASSWORD=prueba-ci trazalab:ci >/dev/null
          for intento in {1..90}; do
            if curl --fail --silent http://127.0.0.1:18080/db-health >/dev/null; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$aplicacion")" != true ]; then
              exit 1
            fi
            if [ "$intento" -eq 90 ]; then
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/health
          curl --fail --silent http://127.0.0.1:18080/db-health
          curl --fail --silent http://127.0.0.1:18080/api/health

  artefacto-publicable:
    name: Habilitar imagen verificada para publicación
    if: ${{ inputs.guardar_imagen }}
    needs:
      - maven-verify
      - imagen-docker
      - smoke-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar imagen construida
        uses: actions/download-artifact@v4
        with:
          name: trazalab-imagen-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artefacto-imagen

      - name: Volver a comprobar la imagen publicable
        shell: bash
        run: |
          set -euo pipefail
          cd artefacto-imagen
          sha256sum --check trazalab.tar.sha256
          docker image load --input trazalab.tar
          esperado=$(tr -d '\r\n' < imagen.id)
          actual=$(docker image inspect --format '{{.Id}}' trazalab:ci)
          [[ "$esperado" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$actual" = "$esperado"

      - name: Publicar artefacto verificado para release
        uses: actions/upload-artifact@v4
        with:
          name: trazalab-imagen-comprobada
          path: |
            artefacto-imagen/trazalab.tar
            artefacto-imagen/trazalab.tar.sha256
            artefacto-imagen/imagen.id
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
