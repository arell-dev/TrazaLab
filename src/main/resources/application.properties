spring.application.name=trazalab
server.port=8080
spring.main.banner-mode=console
spring.main.log-startup-info=true
spring.thymeleaf.cache=false
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
trazalab.seed.enabled=false
trazalab.demo.usuario-correo=${TRAZALAB_DEMO_USER_EMAIL:ana.torres.demo@trazalab.local}
trazalab.demo.mantenimiento-correo=${TRAZALAB_DEMO_TECH_EMAIL:tecnico.trazalab.demo@trazalab.local}
