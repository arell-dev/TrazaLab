<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <th:block th:fragment="mensajes">
        <div class="toast-container position-fixed top-0 end-0 p-3 app-toast-container" th:if="${mensajeExito}">
            <div class="toast show app-toast" role="status" aria-live="polite" data-toast>
                <div class="d-flex align-items-center">
                    <span class="material-symbols-outlined text-success ms-3" aria-hidden="true">check_circle</span>
                    <div class="toast-body" th:text="${mensajeExito}">Registro completado.</div>
                    <button class="btn-close me-3" type="button" aria-label="Cerrar aviso" data-toast-close></button>
                </div>
            </div>
        </div>
    </th:block>
</body>

</html>
