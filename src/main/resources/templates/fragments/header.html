<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <header th:fragment="header" class="app-header">
        <div class="container-fluid d-flex align-items-center gap-3 px-3 px-lg-4">
            <button class="app-menu-button d-lg-none" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#navigationDrawer" aria-controls="navigationDrawer" aria-label="Abrir menú">
                <span class="material-symbols-outlined" aria-hidden="true">menu</span>
            </button>

            <div class="app-header__account">
                <span class="app-header__account-avatar" aria-hidden="true">
                    <span class="material-symbols-outlined">person</span>
                </span>
                <span class="app-header__account-copy">
                    <strong th:text="${correoSesion}">Cuenta autenticada</strong>
                    <span class="app-header__account-location">
                        <span class="material-symbols-outlined" aria-hidden="true">location_on</span>
                        Sesión autenticada
                    </span>
                </span>
            </div>

            <form class="ms-auto" method="post" th:action="@{/logout}">
                <button class="btn btn-outline-secondary btn-sm" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </header>
</body>

</html>
