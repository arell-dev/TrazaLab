apiVersion: apps/v1
kind: Deployment
metadata:
  name: trazalab-caddy
  labels:
    app.kubernetes.io/name: trazalab-caddy
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trazalab-caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trazalab-caddy
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        trazalab.utp.edu.pe/almacen-postgres: verificado
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
          args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          env:
            - name: TRAZALAB_ORIGEN
              value: origen.invalid
            - name: TRAZALAB_ORIGEN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trazalab-origen-token
                  key: token
            - name: XDG_DATA_HOME
              value: /almacen/data
            - name: XDG_CONFIG_HOME
              value: /almacen/config
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              hostPort: 443
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: configuracion
              mountPath: /etc/caddy
              readOnly: true
            - name: certificados
              mountPath: /almacen
            - name: temporales
              mountPath: /tmp
      volumes:
        - name: configuracion
          configMap:
            name: trazalab-caddy-configuracion
        - name: certificados
          hostPath:
            path: /var/lib/trazalab-data/caddy
            type: Directory
        - name: temporales
          emptyDir: {}
