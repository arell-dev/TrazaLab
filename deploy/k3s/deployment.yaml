apiVersion: apps/v1
kind: Deployment
metadata:
  name: trazalab
  labels:
    app.kubernetes.io/name: trazalab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trazalab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trazalab
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: trazalab-ecr-pull
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trazalab
          image: invalid.invalid/trazalab:configurar
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: trazalab-database
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trazalab-database
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trazalab-database
                  key: SPRING_DATASOURCE_PASSWORD
            - name: TRAZALAB_ACTIVIDAD_HABILITADA
              value: "true"
            - name: TRAZALAB_ACTIVIDAD_CANAL_HABILITADO
              value: "true"
            - name: TRAZALAB_ACTIVIDAD_SOCKET
              value: /run/trazalab-control/control.sock
          volumeMounts:
            - name: control-apagado
              mountPath: /run/trazalab-control
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: control-apagado
          hostPath:
            path: /run/trazalab-control
            type: Directory
