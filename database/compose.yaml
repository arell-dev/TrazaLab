services:
  postgres:
    image: postgres:16
    container_name: trazalab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trazalab
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:?Define SPRING_DATASOURCE_USERNAME en .env}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Define SPRING_DATASOURCE_PASSWORD en .env}
    ports:
      - "5433:5432"
    volumes:
      - trazalab_postgres_data:/var/lib/postgresql/data
      - ./01_trazalab_schema.sql:/docker-entrypoint-initdb.d/01_trazalab_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trazalab_postgres_data:
